name: Update F1 Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-f1:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate F1 JSON
        run: node scripts/update-f1.js

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No F1 data changes"
          else
            git commit -m "Update F1 data"
            git push
          fi
